name: Input Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
      artifact_tag:
        description: hello
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Display Environment
        run: echo "Deploying application to ${{ inputs.environment }} ${{ github.actor }}"
